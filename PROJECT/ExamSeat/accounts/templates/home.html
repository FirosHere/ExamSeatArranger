<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
        }
        /* Navbar */
        .navbar {
            background: #5563DE;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .navbar h1 {
            margin: 0;
            font-size: 22px;
        }
        .navbar a {
            color: white;
            text-decoration: none;
            background: #ff6b6b;
            padding: 8px 15px;
            border-radius: 6px;
        }
        .navbar a:hover {
            background: #e84141;
        }
        /* Main content */
        .container {
            padding: 30px;
        }
        .welcome {
            margin-bottom: 30px;
            font-size: 20px;
            color: #333;
        }
        /* Cards */
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }
        .card h3 {
            margin-bottom: 15px;
            color: #444;
        }
        .card a {
            display: inline-block;
            padding: 10px 15px;
            background: #5563DE;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }
        .card a:hover {
            background: #3f4cb3;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <div class="navbar">
        <h1>Exam Seat Arranger</h1>
        <a href="{% url 'logout' %}">Logout</a>
    </div>

    <!-- Content -->
    <div class="container">
        <div class="welcome">Welcome, {{ request.user.username }}</div>

        <div class="cards">
            <div class="card">
                <h3>Upload Students CSV</h3>
  <a href="{% url 'upload_students' %}">Go</a>            </div>
            <div class="card">
                <h3>Set Classroom Layout</h3>
                <a href="{% url 'add_room' %}">Go</a>
            </div>
            <div class="card">
                <h3>Generate Seat Arrangement</h3>
               <a href="{% url 'generate_seats' %}">Go</a>
            </div>
            <div class="card">
                <h3>View Allotments</h3>
                <a href="{% url 'view_allotments' %}">Go</a>
            </div>
        </div>
    </div>
</body>
</html>
